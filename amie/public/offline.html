<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>Amie · You’re offline</title>
<style>
  :root { color-scheme:light; --paper:#f5f5f7; --accent:#0062cc; --muted:#6e6e73; }
  :root[data-theme='dark'] { color-scheme:dark; --paper:#171719; --accent:#82baff; --muted:#b7b7c0; }
  body { box-sizing:border-box; margin:0; background:var(--paper); color:var(--accent); min-height:100dvh; display:grid; place-content:center; text-align:center; font-family:-apple-system,sans-serif; padding:30px; }
  h1 { font:600 40px -apple-system,BlinkMacSystemFont,system-ui,sans-serif; margin:15px; }
  p { font-size:14px; line-height:1.9; color:var(--muted); }
  a { display:inline-block; margin-top:15px; padding:14px 25px; background:#006de5; color:white; border-radius:12px; text-decoration:none; }
</style>
<script>
  try {
    const appearance = localStorage.getItem('amie.appearance') ?? localStorage.getItem('amie.map.appearance');
    const system = matchMedia('(prefers-color-scheme: dark)');
    function updateTheme() {
      const dark = appearance === 'dark' || (appearance === 'system' && system.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#171719' : '#f5f5f7';
    }
    updateTheme();
    system.addEventListener('change', updateTheme);
  } catch {}
</script>
<h1>amie ♡</h1>
<p>Your little space will be here.<br>Reconnect to see your messages and moments.</p>
<a href="./">Try again</a>
</html>
