name: Deploy Amie to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['amie/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: amie/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: amie
      - run: npx vite build --config vite.pages.config.ts
        working-directory: amie
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: amie/dist-pages
      - uses: actions/deploy-pages@v4
        id: deployment
